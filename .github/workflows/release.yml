name: Release Plugin Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc

      - name: Build C-Shared Library (.so)
        run: |
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o opencode-go-linux-amd64.so main.go

      - name: Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            opencode-go-linux-amd64.so
            opencode-go-linux-amd64.h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
